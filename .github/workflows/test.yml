name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local:
    name: Local Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run local tests
        run: bash tests/oa-test.sh --local

  remote:
    name: EC2 Integration Tests
    needs: local
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST not set — skipping EC2 integration tests"
            echo "Add EC2_HOST, EC2_USER, and EC2_KEY to repository secrets to enable"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          bash tests/oa-test.sh --suite integration
