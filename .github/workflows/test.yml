name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local:
    name: Local Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run local tests
        run: bash tests/oa-test.sh --local

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-local
          path: /tmp/test-output.txt
          retention-days: 7

  remote:
    name: EC2 Integration Tests
    needs: local
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && secrets.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run integration tests on EC2
        run: |
          export EC2_HOST="${{ secrets.EC2_HOST }}"
          export EC2_USER="${{ secrets.EC2_USER }}"
          export EC2_KEY_PATH="$HOME/.ssh/ec2-key.pem"
          bash tests/oa-test.sh --suite integration

      - name: Upload integration test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-remote
          path: /tmp/test-output.txt
          retention-days: 7
